<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">Where one call's 1.4 seconds go</title>
  <desc id="desc">One stacked horizontal bar of the median time per stage, one session, telephone channel with 8 kHz G.711 mu-law input, 126 utterances, from the end of the caller's speech to the first audio sent. End of speech detected by the VAD: 525 ms, of which 500 ms is AICC's silence_duration_ms setting. Smart Turn verdict: 68 ms. ASR: 220 ms. LLM first token: 318 ms. First sentence ready: 96 ms. TTS first chunk: 76 ms. First audio sent, mostly synthesizing the leading silence the trimmer drops: 102 ms. The stage medians add up to 1405 ms; the end-to-end median of the run is 1404 ms.</desc>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#f6f8fa"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#d0d7de" stroke-width="3"/>
    </pattern>
    <style>
      .bg { fill: #ffffff; }
      .wait { fill: url(#hatch); stroke: #8c959f; stroke-width: 1.2; }
      .model { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
      .glue { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .grid { stroke: #d0d7de; stroke-width: 1; }
      .axis { stroke: #8c959f; stroke-width: 1.2; }
      .lead { stroke: #8c959f; stroke-width: 1; }
      .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .v { font-size: 13px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12px; fill: #424a53; }
      .l { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="300" rx="12"/>

  <text class="h" x="20" y="34">Where one call's 1.4 s goes: median per stage</text>
  <text class="s" x="20" y="54">One session, 8 kHz G.711 μ-law in, 126 utterances. End of caller speech → first audio sent. The stage medians add up to the end-to-end median.</text>

  <!-- Scale: x = 40 + ms * 0.6 -->
  <line class="grid" x1="190" y1="100" x2="190" y2="156"/>
  <line class="grid" x1="340" y1="100" x2="340" y2="156"/>
  <line class="grid" x1="490" y1="100" x2="490" y2="156"/>
  <line class="grid" x1="640" y1="100" x2="640" y2="156"/>
  <line class="grid" x1="790" y1="100" x2="790" y2="156"/>
  <line class="grid" x1="940" y1="100" x2="940" y2="156"/>

  <!-- Bracket over AICC's 500 ms silence -->
  <path class="lead" d="M40,96 V88 H340 V96" fill="none"/>
  <text class="s" x="190" y="82" text-anchor="middle">500 ms: AICC's silence_duration_ms</text>

  <!-- Segments -->
  <rect class="wait" x="40" y="104" width="315" height="48"/>
  <text class="v" x="197.5" y="133" text-anchor="middle">VAD end of speech 525</text>

  <rect class="glue" x="355" y="104" width="40.8" height="48"/>

  <rect class="model" x="395.8" y="104" width="132" height="48"/>
  <text class="v" x="461.8" y="133" text-anchor="middle">ASR 220</text>

  <rect class="model" x="527.8" y="104" width="190.8" height="48"/>
  <text class="v" x="623.2" y="133" text-anchor="middle">LLM first token 318</text>

  <rect class="glue" x="718.6" y="104" width="57.6" height="48"/>
  <rect class="model" x="776.2" y="104" width="45.6" height="48"/>
  <rect class="glue" x="821.8" y="104" width="61.2" height="48"/>

  <!-- Total -->
  <line class="axis" x1="883" y1="96" x2="883" y2="160"/>
  <text class="v" x="891" y="92">1405 ms</text>

  <!-- Leader labels for narrow segments -->
  <line class="lead" x1="375.4" y1="152" x2="375.4" y2="180"/>
  <text class="s" x="375.4" y="194" text-anchor="middle">Smart Turn 68</text>

  <line class="lead" x1="747.4" y1="152" x2="747.4" y2="180"/>
  <text class="s" x="740" y="194" text-anchor="end">first sentence 96</text>

  <line class="lead" x1="799" y1="152" x2="799" y2="200"/>
  <text class="s" x="790" y="214" text-anchor="end">TTS first chunk 76</text>

  <line class="lead" x1="852.4" y1="152" x2="852.4" y2="220"/>
  <text class="s" x="843" y="234" text-anchor="end">first audio sent 102 (trimming ~0.45 s of synthesized silence)</text>

  <!-- Axis -->
  <line class="axis" x1="40" y1="256" x2="940" y2="256"/>
  <line class="axis" x1="40" y1="256" x2="40" y2="262"/>
  <line class="axis" x1="190" y1="256" x2="190" y2="262"/>
  <line class="axis" x1="340" y1="256" x2="340" y2="262"/>
  <line class="axis" x1="490" y1="256" x2="490" y2="262"/>
  <line class="axis" x1="640" y1="256" x2="640" y2="262"/>
  <line class="axis" x1="790" y1="256" x2="790" y2="262"/>
  <line class="axis" x1="940" y1="256" x2="940" y2="262"/>
  <text class="l" x="40" y="278" text-anchor="middle">0</text>
  <text class="l" x="190" y="278" text-anchor="middle">250</text>
  <text class="l" x="340" y="278" text-anchor="middle">500</text>
  <text class="l" x="490" y="278" text-anchor="middle">750</text>
  <text class="l" x="640" y="278" text-anchor="middle">1000</text>
  <text class="l" x="790" y="278" text-anchor="middle">1250</text>
  <text class="l" x="940" y="278" text-anchor="middle">1500 ms</text>
</svg>
