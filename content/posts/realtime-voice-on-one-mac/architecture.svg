<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">mlx-realtime: one gateway and three MLX model processes on one Mac</title>
  <desc id="desc">Realtime clients (AICC carrying FreeSWITCH calls, the openai SDK, the benchmark) connect over WebSocket at /v1/realtime with the OpenAI Realtime GA protocol. The gateway, Python 3.12 and asyncio with no MLX installed, runs the protocol, sessions, barge-in, segmentation, normalization, G.711 and metrics, Silero VAD and Smart Turn under onnxruntime, and two echo cancellers: WebRTC AEC3 in front of the VAD and Smart Turn, SpeexDSP in front of the ASR; it holds 0.25 GB. It calls three MLX processes on localhost: the ASR on port 8102, Qwen3-ASR-1.7B 8-bit, 2.5 GB; the LLM on port 8101, Qwen3.6-35B-A3B 4-bit under mlx_lm.server with prompt-cache checkpoints, 22.9 GB with 64 cached prompts; the TTS on port 8103, Qwen3-TTS-0.6B CustomVoice 8-bit with a 4-bit fallback, 3.8 GB, which synthesizes one stream at a time. The three processes share one GPU and unified memory on an M3 Max with 128 GB. Memory is resident after warmup.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .ours { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
      .other { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .limit { fill: #fff8c5; stroke: #9a6700; stroke-width: 1.5; }
      .group { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .link { fill: none; stroke: #57606a; stroke-width: 1.5; }
      .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12px; fill: #424a53; }
      .l { font-size: 11.5px; fill: #57606a; }
      .m { font-size: 13px; font-weight: 600; fill: #0969da; }
      .w { font-size: 12px; font-weight: 600; fill: #9a6700; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="470" rx="12"/>

  <!-- Clients -->
  <rect class="other" x="250" y="20" width="500" height="50" rx="8"/>
  <text class="h" x="500" y="42" text-anchor="middle">Realtime clients</text>
  <text class="s" x="500" y="60" text-anchor="middle">AICC (FreeSWITCH calls) · openai SDK · bench</text>

  <line class="link" x1="500" y1="70" x2="500" y2="112" marker-end="url(#arrow)"/>
  <text class="l" x="512" y="95">WebSocket /v1/realtime · OpenAI Realtime (GA)</text>

  <!-- Gateway -->
  <rect class="ours" x="40" y="116" width="920" height="122" rx="8"/>
  <text class="h" x="60" y="142">gateway</text>
  <text class="s" x="128" y="142">Python 3.12 · asyncio · CPU · no MLX installed</text>
  <text class="m" x="940" y="142" text-anchor="end">0.25 GB</text>
  <text class="s" x="60" y="170">protocol · sessions · barge-in and truncation · segmenter · normalizer · G.711 · metrics</text>
  <text class="s" x="60" y="192">Silero VAD + Smart Turn (onnxruntime)</text>
  <text class="s" x="60" y="214">echo: WebRTC AEC3 → VAD and Smart Turn · SpeexDSP → ASR · reference = our own output on a model of AICC's playout</text>

  <!-- Links to backends -->
  <line class="link" x1="190" y1="238" x2="190" y2="304" marker-end="url(#arrow)"/>
  <text class="l" x="200" y="276">HTTP</text>
  <line class="link" x1="500" y1="238" x2="500" y2="304" marker-end="url(#arrow)"/>
  <text class="l" x="510" y="276">HTTP + SSE</text>
  <line class="link" x1="810" y1="238" x2="810" y2="304" marker-end="url(#arrow)"/>
  <text class="l" x="820" y="276">HTTP, chunked PCM</text>

  <!-- Backends group -->
  <rect class="group" x="30" y="292" width="940" height="140" rx="10"/>
  <text class="l" x="44" y="424">three MLX processes on 127.0.0.1, each its own uv project, sharing one GPU and unified memory</text>

  <!-- ASR -->
  <rect class="ours" x="50" y="308" width="280" height="100" rx="8"/>
  <text class="h" x="190" y="332" text-anchor="middle">ASR :8102</text>
  <text class="s" x="190" y="354" text-anchor="middle">Qwen3-ASR-1.7B 8-bit</text>
  <text class="l" x="190" y="372" text-anchor="middle">mlx_audio.server + context patch</text>
  <text class="m" x="190" y="396" text-anchor="middle">2.5 GB</text>

  <!-- LLM -->
  <rect class="ours" x="360" y="308" width="280" height="100" rx="8"/>
  <text class="h" x="500" y="332" text-anchor="middle">LLM :8101</text>
  <text class="s" x="500" y="354" text-anchor="middle">Qwen3.6-35B-A3B 4-bit</text>
  <text class="l" x="500" y="372" text-anchor="middle">mlx_lm.server + prompt-cache checkpoints</text>
  <text class="m" x="500" y="396" text-anchor="middle">22.9 GB</text>

  <!-- TTS -->
  <rect class="limit" x="670" y="308" width="280" height="100" rx="8"/>
  <text class="h" x="810" y="332" text-anchor="middle">TTS :8103</text>
  <text class="s" x="810" y="354" text-anchor="middle">Qwen3-TTS-0.6B 8-bit + 4-bit fallback</text>
  <text class="w" x="810" y="372" text-anchor="middle">one stream at a time</text>
  <text class="m" x="810" y="396" text-anchor="middle">3.8 GB</text>

  <text class="l" x="500" y="456" text-anchor="middle">M3 Max, 128 GB. Memory is resident after warmup, LLM with 64 cached prompts: about 29.5 GB in all.</text>
</svg>
