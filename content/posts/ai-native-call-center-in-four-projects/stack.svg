<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">An AI-native call center in four open-source projects</title>
  <desc id="desc">Callers and agent browsers reach FreeSBC, the only host with a public SIP and RTP address. FreeSBC relays to FreeSWITCH on the private network. AICC drives FreeSWITCH, answers calls with a realtime voice model, and talks the OpenAI Realtime protocol either to Cascade Realtime Gateway, which runs ASR, LLM and TTS providers, or directly to a hosted realtime model. Web SIP Phone carries the agent's audio; the AICC agent desktop handles call control over REST and SSE.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .ours { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.5; }
      .other { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
      .group { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
      .link { fill: none; stroke: #57606a; stroke-width: 1.5; }
      .alt { stroke-dasharray: 5 4; }
      .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
      .s { font-size: 12px; fill: #424a53; }
      .l { font-size: 11.5px; fill: #57606a; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="450" rx="12"/>

  <!-- Caller -->
  <rect class="other" x="20" y="60" width="200" height="66" rx="8"/>
  <text class="h" x="120" y="88" text-anchor="middle">Caller</text>
  <text class="s" x="120" y="108" text-anchor="middle">PSTN via a SIP trunk</text>

  <!-- Agent browser -->
  <rect class="group" x="12" y="236" width="216" height="140" rx="10"/>
  <text class="l" x="120" y="254" text-anchor="middle">agent's Chrome</text>
  <rect class="ours" x="24" y="264" width="192" height="44" rx="7"/>
  <text class="h" x="120" y="283" text-anchor="middle">Web SIP Phone</text>
  <text class="s" x="120" y="300" text-anchor="middle">extension: the audio leg</text>
  <rect class="ours" x="24" y="322" width="192" height="44" rx="7"/>
  <text class="h" x="120" y="341" text-anchor="middle">AICC agent desktop</text>
  <text class="s" x="120" y="358" text-anchor="middle">web app: the call controls</text>
  <line class="link" x1="120" y1="320" x2="120" y2="310" marker-end="url(#arrow)"/>

  <!-- FreeSBC -->
  <rect class="ours" x="250" y="128" width="164" height="124" rx="8"/>
  <text class="h" x="332" y="156" text-anchor="middle">FreeSBC</text>
  <text class="s" x="332" y="180" text-anchor="middle">the only public SIP/RTP</text>
  <text class="s" x="332" y="196" text-anchor="middle">WebRTC ↔ plain RTP</text>
  <text class="s" x="332" y="212" text-anchor="middle">scanner bans</text>
  <text class="s" x="332" y="228" text-anchor="middle">topology hiding</text>

  <!-- Private network: FreeSWITCH + AICC -->
  <rect class="group" x="478" y="84" width="220" height="198" rx="10"/>
  <text class="l" x="588" y="101" text-anchor="middle">private network</text>
  <rect class="other" x="492" y="110" width="192" height="60" rx="7"/>
  <text class="h" x="588" y="135" text-anchor="middle">FreeSWITCH</text>
  <text class="s" x="588" y="155" text-anchor="middle">media and queues</text>
  <rect class="ours" x="492" y="194" width="192" height="76" rx="7"/>
  <text class="h" x="588" y="218" text-anchor="middle">AICC</text>
  <text class="s" x="588" y="238" text-anchor="middle">answers every call with AI</text>
  <text class="s" x="588" y="254" text-anchor="middle">drives the switch over ESL</text>
  <line class="link" x1="588" y1="192" x2="588" y2="172" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Model side -->
  <rect class="ours" x="750" y="60" width="230" height="90" rx="8"/>
  <text class="h" x="865" y="88" text-anchor="middle">Cascade Realtime Gateway</text>
  <text class="s" x="865" y="110" text-anchor="middle">ASR → LLM → TTS behind</text>
  <text class="s" x="865" y="126" text-anchor="middle">one Realtime API</text>
  <rect class="other" x="750" y="214" width="230" height="66" rx="8"/>
  <text class="h" x="865" y="242" text-anchor="middle">Hosted realtime model</text>
  <text class="s" x="865" y="262" text-anchor="middle">OpenAI · Qwen · Doubao · Gemini</text>
  <text class="l" x="865" y="186" text-anchor="middle">both speak the OpenAI Realtime protocol</text>

  <!-- Links -->
  <path class="link" d="M220,93 C240,93 230,160 248,160" marker-end="url(#arrow)"/>
  <text class="l" x="228" y="80">SIP + RTP</text>

  <path class="link" d="M216,286 C236,286 230,232 248,232" marker-end="url(#arrow)"/>
  <text class="l" x="236" y="300">WSS +</text>
  <text class="l" x="236" y="314">DTLS-SRTP</text>

  <line class="link" x1="414" y1="150" x2="490" y2="142" marker-end="url(#arrow)"/>
  <text class="l" x="442" y="130" text-anchor="middle">SIP + RTP</text>

  <path class="link" d="M216,344 H588 V272" marker-end="url(#arrow)"/>
  <text class="l" x="250" y="364">HTTPS: REST + SSE (answer, hold, transfer, screen-pop)</text>

  <path class="link" d="M684,218 C720,218 718,105 748,105" marker-end="url(#arrow)"/>
  <path class="link alt" d="M684,248 C716,248 718,247 748,247" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect class="ours" x="20" y="400" width="18" height="14" rx="3"/>
  <text class="s" x="46" y="412">open-source project in this series</text>
  <rect class="other" x="270" y="400" width="18" height="14" rx="3"/>
  <text class="s" x="296" y="412">everything else</text>
  <line class="link alt" x1="420" y1="407" x2="452" y2="407"/>
  <text class="s" x="460" y="412">alternative to Cascade</text>
  <text class="l" x="20" y="436">Cascade's own ASR, LLM and TTS providers (Deepgram, OpenAI, Qwen) are not drawn.</text>
</svg>
