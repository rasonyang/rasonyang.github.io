{{- /* giscus comments, rendered by Blowfish via article.showComments. Blowfish probes this file with templates.Exists "partials/comments.html", so it must stay in the legacy partials/ directory. */ -}}
{{- with site.Params.giscus }}
{{- if and .repoId .categoryId }}
<div class="giscus-comments">
<script src="https://giscus.app/client.js"
        data-repo="{{ .repo }}"
        data-repo-id="{{ .repoId }}"
        data-category="{{ .category }}"
        data-category-id="{{ .categoryId }}"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async></script>
</div>
{{- end }}
{{- end }}
