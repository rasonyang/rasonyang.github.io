{{- /* Hextra hook: recent posts list on the home page. */ -}}
{{- if .IsHome }}
<div class="hx:max-w-3xl hx:mx-auto">
  <h2 class="hx:text-2xl hx:font-semibold hx:mb-2">Recent posts</h2>
  {{- range first 10 (where site.RegularPages "Section" "posts") }}
  <div class="hx:mb-8">
    <h3><a style="color: inherit; text-decoration: none;" class="hx:block hx:font-semibold hx:mt-6 hx:text-xl" href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
    <p class="hx:opacity-80 hx:mt-2 hx:leading-7">{{ partial "utils/page-description" . }}</p>
    <p class="hx:opacity-50 hx:text-sm hx:mt-2">{{ partial "utils/format-date" .Date }}</p>
  </div>
  {{- end }}
</div>
{{- end }}
