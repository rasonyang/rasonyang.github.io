name: links

on:
  schedule:
    - cron: "17 2 * * 1"   # weekly, Monday 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  HUGO_VERSION: 0.167.0

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.deb \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb
      - name: Build
        run: hugo --minify
      # Check external links in built posts only; a failed run emails the repo owner.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --scheme https --scheme http
            --exclude '^https://rasonyang\.dev'
            --max-retries 3
            'public/posts/**/*.html'
          fail: true
