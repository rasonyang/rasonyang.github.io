baseURL = "https://rasonyang.dev/"
locale = "en-US"
title = "Rason Yang"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = true

[pagination]
  pagerSize = 10

# Topic tags (sip, freeswitch, realtime, ...) plus one term per open-source
# project. A project term page lives at /projects/<slug>/ and its intro text
# comes from content/projects/<slug>/_index.md. Each term has its own RSS feed.
[taxonomies]
  tag = "tags"
  project = "projects"

[permalinks]
  # Slugs are permanent once published. No dates in URLs.
  posts = "/posts/:slug/"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML", "RSS"]

[services.rss]
  limit = 20

[markup.goldmark.renderer]
  unsafe = false

[markup.highlight]
  noClasses = false
  style = "github"

[minify]
  minifyOutput = true

[params]
  env = "production"
  author = "Rason Yang"
  description = "Engineering notes on open-source voice AI infrastructure: SIP, FreeSWITCH, realtime voice models, and AI-native call centers."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  ShowShareButtons = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  disableSpecial1stPost = true
  hideFooter = false
  # Social card fallback; replace with a real 1200x630 image when available.
  images = []

  [params.homeInfoParams]
    Title = "Rason Yang"
    Content = """
Engineering notes from building an open-source, AI-native call center stack:

**Web SIP Phone / PSTN → FreeSBC → FreeSWITCH + AICC → Cascade Realtime Gateway → realtime model or ASR → LLM → TTS**

Posts cover the parts that were hard, surprising, or that I got wrong the first time.
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rasonyang"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.editPost]
    URL = "https://github.com/rasonyang/rasonyang.github.io/blob/main/content"
    Text = "Suggest a fix"
    appendFilePath = true

  # Comments via giscus, backed by GitHub Discussions on this repo.
  # Fill in repoId and categoryId from https://giscus.app after installing the
  # giscus app and enabling Discussions. Comments render only when both are set.
  [params.giscus]
    repo = "rasonyang/rasonyang.github.io"
    repoId = "R_kgDOL6eLPQ"
    category = "Comments"
    categoryId = "DIC_kwDOL6eLPc4DGsvc"

  # Cookie-free analytics. Set to your GoatCounter code (e.g. "rasonyang") to enable.
  [params.analytics.goatcounter]
    code = "rasonyang"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "projects"
    name = "Projects"
    url = "/projects/"
    weight = 20
  [[menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 30
