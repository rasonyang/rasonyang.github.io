# Blowfish theme options. Keys: https://blowfish.page/docs/configuration/
colorScheme = "ocean"
defaultAppearance = "light"
autoSwitchAppearance = true   # follow prefers-color-scheme
enableSearch = true           # uses the JSON home output already enabled
enableCodeCopy = true
mainSections = ["posts"]

[header]
  layout = "fixed"

[footer]
  showMenu = false
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # "custom" renders layouts/_partials/home/custom.html (intro text from
  # params.homeInfoParams), then the recent-articles list below it.
  layout = "custom"
  showRecent = true
  showRecentItems = 10
  showMoreLink = true
  showMoreLinkDest = "/posts/"
  cardView = false

[article]
  showDate = true
  showAuthor = false
  showReadingTime = true
  showWordCount = false
  showTableOfContents = true
  showHeadingAnchors = true
  showPagination = true
  showTaxonomies = true
  showTags = true
  showEdit = true
  editURL = "https://github.com/rasonyang/rasonyang.github.io/blob/main/content/"
  editAppendPath = true
  showComments = true      # renders the root giscus partial (comments.html)

[list]
  groupByYear = false
  showSummary = true
  showTableOfContents = false

[taxonomy]
  showTermCount = true

[term]
  showTableOfContents = false
  groupByYear = false
